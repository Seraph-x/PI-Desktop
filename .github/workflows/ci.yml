name: Fixed-head transcript comparison
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Full immutable SHA of the main plus PR candidate
        required: true
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Install the same display environment for both arms
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes openbox xauth xvfb
      - name: Compare three original runs and the same added regression
        env:
          COMPARISON_BASE: b91f35122f8dea64a610453fd1a9ecf33e57ce1b
          COMPARISON_CANDIDATE: ${{ inputs.candidate }}
        run: node scripts/compare-transcript-scroll.mjs
      - name: Retain every result, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fixed-head-transcript-comparison
          path: ${{ runner.temp }}/transcript-comparison-artifacts
