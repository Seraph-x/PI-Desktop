name: Transcript scroll diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transcript-scroll:
    strategy:
      fail-fast: false
      matrix:
        ref:
          - 5aa253883c4e34fd65d31c434256d424c352bf0b
          - e22816bd2c9f4985932726d30075f60ba220f4b7
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select production source with identical observed fixture
        run: |
          cp scripts/e2e/transcript-long-history.tsx "$RUNNER_TEMP/transcript-long-history.tsx"
          git checkout --detach '${{ matrix.ref }}'
          cp "$RUNNER_TEMP/transcript-long-history.tsx" scripts/e2e/transcript-long-history.tsx
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xauth xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pi-desktop/desktop exec install-electron
      - name: Configure Chromium sandbox
        run: |
          sandbox=apps/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - run: pnpm build:js
      - name: Repeat original transcript assertion with geometry diagnostics
        run: |
          for run in 1 2 3 4 5; do
            echo "Transcript repeat ${run}, production source ${{ matrix.ref }}"
            xvfb-run --auto-servernum node scripts/e2e-transcript-render.mjs || exit $?
          done
