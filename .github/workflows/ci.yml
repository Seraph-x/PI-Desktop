name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificate-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes xauth xvfb
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pi-desktop/desktop exec install-electron
      - name: Configure Chromium sandbox
        run: |
          sandbox=apps/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - run: pnpm build:js
      - name: Repeat isolated certificate fixture five times
        run: |
          for run in 1 2 3 4 5; do
            echo "Certificate fixture repeat ${run}"
            xvfb-run --auto-servernum node scripts/e2e-provider-client-certificate.mjs || exit $?
          done
